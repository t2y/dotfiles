#autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto

# initial workspaces
## DP-2
workspace = 1, monitor:DP-2, persistent:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true
workspace = 4, monitor:DP-2, persistent:true
workspace = 5, monitor:DP-2, persistent:true
## DP-3
workspace = 6, monitor:DP-3, persistent:true
workspace = 7, monitor:DP-3, persistent:true
workspace = 8, monitor:DP-3, persistent:true
workspace = 9, monitor:DP-3, persistent:true
workspace = 10, monitor:DP-3, persistent:true

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = thunar
$menu = hyprlauncher

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = hyprpaper
exec-once = mako  # notification (or dunst)
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = fcitx5 -d --replace

# my application

## 1password
exec-once = 1password
windowrule = workspace special:mypasswd silent, match:class ^(1password)$

## slack
exec-once = slack
windowrule = workspace special:mychat silent, match:class ^([Ss]lack)$

## upnote
exec-once = /snap/bin/upnote
windowrule = workspace special:mynote silent, match:class ^([Uu]p[Nn]ote)$

## gedit
exec-once = gedit ~/tmp/t.md
windowrule = workspace special:myedit silent, match:class ^(gedit)$

## sticky notes
exec-once = .local/bin/stickly
windowrule = float on, size 480 480, move 100%-360 60, opacity 0.95 0.75, match:class com\.vixalien\.sticky
windowrule = workspace special:mysticky silent, match:class ^com\.vixalien\.sticky$

## thunar (file manager)
exec-once = $fileManager 
windowrule = workspace special:myfiler silent, match:class ^(thunar)$

## termianal
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 1 silent] $terminal
exec-once = [workspace 1 silent] $terminal

## browser
exec-once = brave-browser --class=brave-startup
windowrule = workspace 3 silent, match:class ^(brave-startup)$
exec-once = google-chrome-stable --class=chrome-startup
windowrule = workspace 6 silent, match:class ^(chrome-startup)$

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = PATH,/home/morimoto/.local/bin:/usr/local/bin:/usr/bin:/bin
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# fullscreen
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# ime
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus

